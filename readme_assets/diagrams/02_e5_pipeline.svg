<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="420" viewBox="0 0 1180 420"><rect width="100%" height="100%" fill="white"/><style>.t{font:700 28px Arial;fill:#111827}.s{font:15px Arial;fill:#4b5563}.b{font:700 16px Arial;fill:#111827}.d{font:14px Arial;fill:#374151}.box{stroke:#9ca3af;stroke-width:2;rx:12}.l{stroke:#64748b;stroke-width:3;marker-end:url(#a)}</style><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker></defs><text x="35" y="45" class="t">E5 Reranking Pipeline</text><text x="35" y="72" class="s">Dense semantic ranking after first-stage Elasticsearch retrieval</text><rect x="45" y="125" width="155" height="90" class="box" fill="#eef2ff"/><text x="122" y="160" text-anchor="middle" class="b">Query</text><text x="122" y="187" text-anchor="middle" class="d">q</text><rect x="245" y="105" width="195" height="130" class="box" fill="#f3f4f6"/><text x="342" y="145" text-anchor="middle" class="b">Candidate pool</text><text x="342" y="173" text-anchor="middle" class="d">Elasticsearch</text><text x="342" y="198" text-anchor="middle" class="d">Top-N documents</text><rect x="485" y="105" width="195" height="130" class="box" fill="#fef3c7"/><text x="582" y="145" text-anchor="middle" class="b">E5 embeddings</text><text x="582" y="173" text-anchor="middle" class="d">query + documents</text><text x="582" y="198" text-anchor="middle" class="d">PyTorch CPU</text><rect x="725" y="105" width="195" height="130" class="box" fill="#ecfeff"/><text x="822" y="145" text-anchor="middle" class="b">Similarity</text><text x="822" y="173" text-anchor="middle" class="d">cosine / dot product</text><text x="822" y="198" text-anchor="middle" class="d">normalized vectors</text><rect x="965" y="125" width="165" height="90" class="box" fill="#ecfdf5"/><text x="1047" y="160" text-anchor="middle" class="b">Ranked top-k</text><text x="1047" y="187" text-anchor="middle" class="d">evidence</text><